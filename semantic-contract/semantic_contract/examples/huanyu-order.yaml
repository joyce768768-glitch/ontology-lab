# 寰宇思贤 · 实体：Order（订单）—— M2 新增，经营指标主战场
# 客单价 / 复购率 / 订单状态分布 / 分销结构的语义视图落点
apiVersion: semantic.joyce/v1
kind: SemanticEntity

metadata:
  id: huanyu.order
  domain: ecommerce
  version: 0.1.0
  owner: joyce
  status: draft
  review_note: "M2 新增：从 server/db/schema.ts orders 表 + concepts.ts Order 概念迁入；复购率用原生 SQL 逃生舱表达（DSL 不支持 FILTER 子查询）"

# ── 1. 概念层（唯一进 LLM prompt 的部分）──────────────────
concept:
  name_zh: 订单
  description: >
    用户的一次购买。状态变迁记录在 orderEvents（append-only 事实流），当前态是投影。
    经营分析（客单价/复购/分销结构）的事实来源；金额一律为元（totalAmount），
    显示串 amount 仅用于 B 端列表，不参与统计。
  fields:
    - name: status_code
      desc: 订单状态：pending_payment | pending_delivery | shipped | completed | refunded | cancelled
    - name: total_amount
      desc: 实付金额（元）
    - name: user_id
      desc: 下单会员（复购率按此去重）
    - name: dist_id
      desc: 分销商（空 = 直销/无归属）
    - name: order_day
      desc: 下单日（由 time 列派生，text 时间戳 → date）
  relations:
    - rel: contains_items
      target: huanyu.order_item
      cardinality: 1..n
    - rel: placed_by
      target: huanyu.member
      cardinality: "1"

# ── 2. 物理映射层（编译器专用，永不进 prompt）────────────────
physical_mapping:
  source: postgresql
  tables:
    primary: orders
    detail: orderItems
  field_map:
    status_code: { table: orders, column: '"statusCode"' }
    total_amount: { table: orders, column: '"totalAmount"' }
    user_id: { table: orders, column: '"userId"' }
    dist_id: { table: orders, column: '"distId"' }
    order_day: { table: orders, column: '"time"', transform: "::date" }

# ── 3. 指标视图层（查询规划 Agent 的命中目标）────────────────
semantic_views:
  - id: huanyu.view.avg_order_value
    name_zh: 客单价
    formula: "avg(total_amount) by day"
    grain: [day]
    time_window:
      type: rolling
      days: 30
      anchor: '"orders"."time"'
    notes: 经营核心指标；金额口径唯一来源 orders."totalAmount"（元）
    compile:
      source: orders
      metrics:
        - { name: avg_order_value, agg: avg, expr: '"orders"."totalAmount"' }
        - { name: gmv, agg: sum, expr: '"orders"."totalAmount"' }
      dimensions:
        - { name: day, expr: '"orders"."time"::date' }

  - id: huanyu.view.repeat_purchase_rate
    name_zh: 复购率
    formula: "count(下单≥2次的会员) / count(有订单的会员)"
    grain: []
    time_window:
      type: rolling
      days: 30
      anchor: '"orders"."time"'
    notes: 会员留存质量；窗口内按会员去重
    compile:
      source: orders
      sql: |
        SELECT count(*) FILTER (WHERE order_count >= 2) AS repeat_members,
               count(*) AS total_members,
               round((count(*) FILTER (WHERE order_count >= 2))::numeric
                     / nullif(count(*), 0), 4) AS repeat_rate
        FROM (
          SELECT "userId", count(*) AS order_count
          FROM "orders"
          WHERE {time_window}
          GROUP BY "userId"
        ) t

  - id: huanyu.view.order_status_distribution
    name_zh: 订单状态分布
    formula: "count(*) by day, status_code"
    grain: [day, status_code]
    time_window:
      type: rolling
      days: 7
      anchor: '"orders"."time"'
    notes: 履约漏斗底座（待付款→待发货→已发货→完成/退款/取消）
    compile:
      source: orders
      metrics:
        - { name: order_count, agg: count }
      dimensions:
        - { name: status_code, expr: '"orders"."statusCode"' }
        - { name: day, expr: '"orders"."time"::date' }

  - id: huanyu.view.distributor_structure
    name_zh: 分销商订单结构
    formula: "count(*) as 订单数, sum(total_amount) as 销售额 by dist_id"
    grain: [dist_id]
    time_window:
      type: rolling
      days: 30
      anchor: '"orders"."time"'
    notes: 分销佣金盘子的底座；dist_id 为空即直销单
    compile:
      source: orders
      metrics:
        - { name: order_count, agg: count }
        - { name: sales_amount, agg: sum, expr: '"orders"."totalAmount"' }
      dimensions:
        - { name: dist_id, expr: '"orders"."distId"' }

# ── 4. 治理规则层（校验 Agent 逐条机器判定）──────────────────
policies:
  - id: huanyu.policy.amount_unit_consistency
    name_zh: 金额单位一致性
    type: consistency
    severity: block
    condition:
      when: "semantic_view 引用金额"
      then: "必须引用 totalAmount（元），禁止引用 amount 显示串（'¥256.00' 文本）"
    rationale: "amount 是给前端看的显示串，混入统计即口径事故——客单价算出 NaN 的根源"

  - id: huanyu.policy.member_privacy
    name_zh: 会员隐私
    type: privacy
    severity: warn
    condition:
      when: "视图结果含 user_id 明细"
      then: "结果附提示：会员级数据仅用于聚合，导出需脱敏"
    rationale: "聚合视图天然脱敏；一旦维度下沉到会员粒度，导出即触警"
