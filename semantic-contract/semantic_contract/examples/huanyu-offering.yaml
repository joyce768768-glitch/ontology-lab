# 寰宇思贤 · 示范实体：Offering（卖法）
# 电商域最复杂的本体关系：一本书如何被售卖（单本/套装/盲盒），及盲盒披露治理
apiVersion: semantic.joyce/v1
kind: SemanticEntity

metadata:
  id: huanyu.offering
  domain: ecommerce
  version: 0.2.0
  owner: joyce
  status: draft
  review_note: "v0.2 (M2)：盲盒毛利率因物理层缺 cost 依赖标 blocked（治理活案例），新增可编译的盲盒销售占比；v0.1 (M0) 从 server/ontology/concepts.ts 迁入"

# ── 1. 概念层（唯一进 LLM prompt 的部分）──────────────────
concept:
  name_zh: 卖法
  description: >
    一本书在店铺中的售卖形态。核心洞察：书（Book）和卖法（Offering）是两个概念——
    同一本书可以有单本、套装、盲盒三种卖法；盲盒卖法下，具体书目按概率池分配，
    是否可向用户披露「会拿到哪本」由治理规则决定。
  fields:
    - name: offering_type
      desc: 卖法类型：single（单本）| bundle（套装）| mystery（盲盒）
    - name: price
      desc: 售价（元）
    - name: disclosure_allowed
      desc: 盲盒卖法是否允许向用户披露具体书目（由 policy 计算，非存储字段）
    - name: stock_status
      desc: 库存状态：available | low | out
  relations:
    - rel: contains_book        # 卖法包含书目（盲盒为概率性包含）
      target: huanyu.book
      cardinality: 1..n
    - rel: sold_in_order        # 卖法出现在订单行
      target: huanyu.order_item
      cardinality: 0..n

# ── 2. 物理映射层（编译器专用，永不进 prompt）────────────────
physical_mapping:
  source: postgresql
  tables:
    primary: offerings
    detail: offeringItems
    refs:
      orderItems: 订单行（销售事实，camelCase 表名需引号）
      orders: 订单头（time 列为下单时刻文本）
  field_map:
    offering_type: { table: offerings, column: '"type"' }
    price: { table: offerings, column: '"price_cents"', transform: "value / 100.0" }
    stock_status: { table: offerings, column: '"stock"', transform: "case: >0=available, 1-5=low, 0=out" }
    sale_type: { table: offerings, column: '"saleType"' }
    revenue:
      table: orderItems
      derive: '"orderItems"."price" * "orderItems"."quantity"'
    contains_book:
      via: offeringItems
      join: "offerings.productId = offeringItems.productId"
      target: "offeringItems.bookId"
      probability: "offeringItems.probability"

# ── 3. 指标视图层（查询规划 Agent 的命中目标）────────────────
semantic_views:
  - id: huanyu.view.mystery_sales_share
    name_zh: 盲盒销售占比
    formula: "sum(盲盒订单行收入) / sum(全部订单行收入) by day"
    grain: [day]
    time_window:
      type: rolling
      days: 30
      anchor: '"orders"."time"'
    notes: 卖法结构健康度（M2 口径调整：物理层无逐单成本，毛利率 blocked，先以销售占比观察盲盒盘子）
    compile:
      source: orderItems
      joins:
        - { table: offerings, "on": '"orderItems"."productId" = "offerings"."productId"' }
        - { table: orders, "on": '"orderItems"."orderId" = "orders"."id"' }
      metrics:
        - name: mystery_sales_share
          agg: none
          expr: >
            sum(CASE WHEN "offerings"."saleType" = 'mystery'
                THEN "orderItems"."price" * "orderItems"."quantity" ELSE 0 END)::float
            / nullif(sum("orderItems"."price" * "orderItems"."quantity"), 0)
      dimensions:
        - { name: day, expr: '"orders"."time"::date' }

  - id: huanyu.view.mystery_gross_margin
    name_zh: 盲盒毛利率
    formula: "(sum(revenue) - sum(cost)) / sum(revenue)"
    grain: [day, offering_id]
    time_window: { type: rolling, days: 30, anchor: ordered_at }
    status: blocked                  # 编译器跳过；注册表不展示
    notes: >
      口径依赖未就绪：orderItems 无 cost 列、financeRecords 仅 category 级收支，
      无法按卖法拆逐单成本。解锁条件 = 订单行接入书目成本（offeringItems.weight 加权）。
      治理示例：依赖不满足的口径不进 production，也不进 LLM 注册表。

# ── 4. 治理规则层（校验 Agent 逐条机器判定）──────────────────
policies:
  - id: huanyu.policy.mystery_disclosure
    name_zh: 盲盒披露规则
    type: disclosure
    severity: block            # block=拦截并拒答 | warn=放行但附提示
    condition:
      when: "offering_type == 'mystery'"
      then: "disclosure_allowed == false unless stock_status == 'out'"
    rationale: "盲盒机制受平台规则约束：仅当该卖法缺货（无法履约）时才可向用户披露具体书目，否则视为剧透违规"

  - id: huanyu.policy.price_consistency
    name_zh: 价格口径一致性
    type: consistency
    severity: block
    condition:
      when: "semantic_view 引用 price"
      then: "必须经 field_map.transform 统一为元，禁止直接引用 price_cents"
    rationale: "价格口径唯一真相源在 field_map.transform，绕过即口径漂移"
