[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-contract"
version = "0.2.0"
description = "语义契约编译器：semantic_views YAML → 参数化 SQL（sqlite / postgresql 双方言），输出带 provenance"
requires-python = ">=3.9"
dependencies = ["pyyaml>=5.4"]

[tool.setuptools.packages.find]
include = ["semantic_contract*"]

[tool.setuptools.package-data]
semantic_contract = ["examples/*.yaml"]
