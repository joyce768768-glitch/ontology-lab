<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>医院本体教学系统 - 数据查看器</title>

  <!-- Tabulator 5.x (轻量级表格组件,自带筛选/排序/分页) -->
  <link href="https://cdn.jsdelivr.net/npm/tabulator-tables@5.6.0/dist/css/tabulator.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/tabulator-tables@5.6.0/dist/js/tabulator.min.js"></script>

  <!-- 本地数据文件(必须放在 Tabulator 之后,在主脚本之前) -->
  <script src="data.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #f5f7fa;
      color: #303133;
      padding: 20px;
      font-size: 14px;
      line-height: 1.6;
    }

    /* ===== 顶部标题 ===== */
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 24px 32px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }
    .header h1 { font-size: 22px; margin-bottom: 6px; }
    .header .subtitle { font-size: 13px; opacity: 0.9; }
    .header .meta {
      display: flex;
      gap: 24px;
      margin-top: 12px;
      font-size: 12px;
      opacity: 0.85;
    }
    .header .meta span::before { content: "● "; color: #ffd700; }

    /* 顶部导航链接 */
    .header .nav-link {
      position: absolute;
      top: 24px;
      right: 32px;
      background: rgba(255,255,255,0.2);
      color: white;
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 13px;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,0.4);
      transition: background 0.2s;
    }
    .header .nav-link:hover { background: rgba(255,255,255,0.35); }
    .header { position: relative; }

    /* ===== 图例 ===== */
    .legend {
      background: white;
      padding: 12px 20px;
      border-radius: 8px;
      margin-bottom: 16px;
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      align-items: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }
    .legend-title { font-weight: 600; color: #606266; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #606266; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 500;
    }
    .badge.ontology { background: #e6f4ff; color: #1677ff; border: 1px solid #91caff; }
    .badge.fk { background: #f6ffed; color: #389e0d; border: 1px solid #b7eb8f; }
    .badge.virtual { background: #f0f0f0; color: #8c8c8c; border: 1px solid #d9d9d9; }

    /* ===== Tab 切换栏 ===== */
    .tabs-container {
      background: white;
      border-radius: 8px 8px 0 0;
      padding: 12px 16px 0 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }
    .group-label {
      font-size: 12px;
      color: #909399;
      margin: 12px 0 6px;
      font-weight: 500;
    }
    .group-label:first-child { margin-top: 0; }
    .tabs {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-bottom: -1px;
    }
    .tab {
      padding: 8px 16px;
      border: 1px solid #e4e7ed;
      border-bottom: none;
      background: #f5f7fa;
      cursor: pointer;
      border-radius: 4px 4px 0 0;
      font-size: 13px;
      color: #606266;
      transition: all 0.2s;
    }
    .tab:hover { background: #ecf5ff; color: #409eff; }
    .tab.active {
      background: #409eff;
      color: white;
      border-color: #409eff;
    }
    .tab.fact { border-left: 3px solid #67c23a; }
    .tab.master { border-left: 3px solid #409eff; }

    /* ===== 表格区域 ===== */
    .table-container {
      background: white;
      border-radius: 0 0 8px 8px;
      padding: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
      min-height: 400px;
    }
    .table-meta {
      display: flex;
      gap: 16px;
      margin-bottom: 12px;
      padding: 12px 16px;
      background: #fafafa;
      border-radius: 4px;
      border-left: 4px solid #409eff;
      flex-wrap: wrap;
    }
    .table-meta.fact { border-left-color: #67c23a; }
    .table-meta strong { color: #303133; }
    .table-meta .desc { color: #606266; flex: 1; min-width: 280px; }
    .table-meta .stats { color: #909399; font-size: 12px; }

    /* ===== Tabulator 自定义样式 ===== */
    .tabulator {
      font-size: 13px;
      border-radius: 4px;
      border: 1px solid #ebeef5 !important;
    }
    .tabulator .tabulator-header {
      background: #f5f7fa;
      border-bottom: 1px solid #ebeef5;
    }
    .tabulator .tabulator-col-title {
      font-weight: 600;
      color: #303133;
    }
    .tabulator .tabulator-row:nth-child(even) {
      background: #fafafa;
    }
    .tabulator .tabulator-row:hover {
      background: #ecf5ff;
    }
    /* 本体字段高亮 - 已隐藏 */
    /* 外键列高亮 - 已隐藏 */
    /* JOIN 出来的列样式 - 已隐藏 */

    /* ===== 按钮 ===== */
    .btn-add {
      background: #409eff;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.2s;
      margin-left: auto;
    }
    .btn-add:hover { background: #66b1ff; }
    .btn-action {
      border: 1px solid;
      padding: 3px 10px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 12px;
      margin: 0 2px;
      transition: all 0.2s;
    }
    .btn-edit {
      background: #e6f4ff;
      color: #1677ff;
      border-color: #91caff;
    }
    .btn-edit:hover { background: #1677ff; color: white; }
    .btn-delete {
      background: #fff1f0;
      color: #ff4d4f;
      border-color: #ffa39e;
    }
    .btn-delete:hover { background: #ff4d4f; color: white; }
    .readonly-hint {
      color: #909399;
      font-size: 12px;
      font-style: italic;
    }
    .table-meta .btn-add { margin-left: 12px; }

    /* ===== Modal 弹窗 ===== */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: white;
      border-radius: 8px;
      width: 90%;
      max-width: 560px;
      max-height: 85vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      border-bottom: 1px solid #ebeef5;
      background: #f5f7fa;
    }
    .modal-header h3 { font-size: 16px; color: #303133; }
    .modal-close {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: #909399;
      padding: 0;
      width: 24px;
      height: 24px;
      line-height: 1;
    }
    .modal-close:hover { color: #303133; }
    .modal-body { padding: 20px; overflow-y: auto; }
    .form-row {
      display: flex;
      align-items: center;
      margin-bottom: 14px;
    }
    .form-row label {
      width: 110px;
      font-size: 13px;
      color: #606266;
      text-align: right;
      padding-right: 12px;
      flex-shrink: 0;
    }
    .form-control { flex: 1; }
    .form-control input[type="text"],
    .form-control input[type="number"],
    .form-control input[type="date"] {
      width: 100%;
      padding: 6px 10px;
      border: 1px solid #dcdfe6;
      border-radius: 4px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
      box-sizing: border-box;
    }
    .form-control input:focus { border-color: #409eff; }
    .form-control input[readonly] {
      background: #f5f7fa;
      color: #909399;
      cursor: not-allowed;
    }
    .form-control input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #ebeef5;
    }
    .btn {
      padding: 6px 18px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      border: 1px solid;
      transition: all 0.2s;
    }
    .btn-cancel {
      background: white;
      color: #606266;
      border-color: #dcdfe6;
    }
    .btn-cancel:hover { color: #409eff; border-color: #c0c4cc; }
    .btn-save {
      background: #409eff;
      color: white;
      border-color: #409eff;
    }
    .btn-save:hover { background: #66b1ff; border-color: #66b1ff; }

    /* ===== Footer ===== */
    .footer {
      text-align: center;
      color: #909399;
      font-size: 12px;
      margin-top: 20px;
      padding: 12px;
    }

    /* ===== 空状态 ===== */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #909399;
    }
  </style>
</head>
<body>
  <div class="header">
    <a href="chat.html" class="nav-link">AI 接诊助手 →</a>
    <h1>医院本体教学系统 - 数据层查看器</h1>
    <div class="subtitle">15 张表(9 主数据 + 6 业务事实)· 完整就诊闭环 · 疾病-症状推理基础 · 增删改查</div>
    <div class="meta">
      <span>5 个科室</span>
      <span>5 个患者</span>
      <span>5 个医生</span>
      <span>20 种疾病</span>
      <span>19 种症状</span>
      <span>15 种药品</span>
      <span>8 次就诊</span>
    </div>
  </div>

  <div class="tabs-container">
    <div class="group-label">主数据表(9 张,含知识层)</div>
    <div class="tabs" id="tabs-master"></div>

    <div class="group-label">业务事实表(6 张)</div>
    <div class="tabs" id="tabs-fact"></div>
  </div>

  <div class="table-container">
    <div id="table-meta"></div>
    <div id="table-wrapper">
      <div id="data-table"></div>
    </div>
  </div>

  <!-- Modal: 新增/修改 弹窗 -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modal-title">新增</h3>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body">
        <form id="modal-form" onsubmit="event.preventDefault(); handleSave();">
          <div id="modal-form-body"></div>
          <div class="modal-footer">
            <button type="button" class="btn btn-cancel" onclick="closeModal()">取消</button>
            <button type="submit" class="btn btn-save">保存</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="footer">
    主数据表(8 张)支持增删改查 · 业务事实表(6 张)只读 · 后端 Flask + MySQL · 学习用,非生产数据
  </div>

  <script>
    // ============================================================
    // 配置
    // ============================================================
    const API_BASE = 'http://localhost:5000';  // 后端 Flask API 地址

    const MASTER_ORDER = ["department", "patient", "doctor", "disease_dict", "symptom_dict", "drug", "lab_test_dict", "exam_dict", "disease_symptom"];
    const FACT_ORDER = ["visit", "diagnosis", "symptom_record", "prescription", "prescription_item", "allergy"];

    // 主键字段映射(用于区分主键与外键)
    const PK_FIELDS = {
      department: "dept_id",
      patient: "patient_id",
      doctor: "doctor_id",
      disease_dict: "disease_id",
      symptom_dict: "symptom_id",
      drug: "drug_id",
      lab_test_dict: "lab_test_id",
      exam_dict: "exam_id",
      disease_symptom: "ds_id",
      // 业务事实表主键(只读时操作列不显示,这里仅作完整性)
      visit: "visit_id",
      diagnosis: "diagnosis_id",
      symptom_record: "record_id",
      prescription: "prescription_id",
      prescription_item: "item_id",
      allergy: "allergy_id",
    };

    let currentTable = "visit";  // 默认显示就诊表(只读)
    let tabulatorInstance = null;
    let currentRowData = null;   // 修改模式下当前行数据
    let currentMode = "create";  // create | edit

    const isMaster = (key) => MASTER_ORDER.includes(key);

    // ============================================================
    // Tab 栏渲染
    // ============================================================
    function renderTabs() {
      const masterContainer = document.getElementById("tabs-master");
      const factContainer = document.getElementById("tabs-fact");
      masterContainer.innerHTML = "";
      factContainer.innerHTML = "";

      MASTER_ORDER.forEach(key => {
        const table = TABLES[key];
        const tab = document.createElement("div");
        tab.className = "tab master" + (currentTable === key ? " active" : "");
        tab.textContent = table.name;
        tab.onclick = () => selectTable(key);
        masterContainer.appendChild(tab);
      });

      FACT_ORDER.forEach(key => {
        const table = TABLES[key];
        const tab = document.createElement("div");
        tab.className = "tab fact" + (currentTable === key ? " active" : "");
        tab.textContent = table.name;
        tab.onclick = () => selectTable(key);
        factContainer.appendChild(tab);
      });
    }

    async function selectTable(key) {
      currentTable = key;
      renderTabs();
      await renderTable(key);
    }

    // ============================================================
    // 数据获取:主数据表优先从后端 API,失败时回退到 data.js 静态数据
    // 业务事实表始终用静态 JSON(只读)
    // ============================================================
    async function fetchTableData(key) {
      if (!isMaster(key)) {
        // 业务事实表:用 data.js 的静态数据(只读)
        return TABLES[key].data;
      }
      // 主数据表:优先调后端 API,失败时回退到静态数据(保证页面始终有数据可看)
      try {
        const res = await fetch(`${API_BASE}/api/${key}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return await res.json();
      } catch (err) {
        console.warn(`[兜底] 获取 ${key} 后端数据失败,回退到 data.js 静态数据。原因: ${err.message}`);
        return TABLES[key].data;
      }
    }

    // ============================================================
    // 渲染表格
    // ============================================================
    async function renderTable(key) {
      const table = TABLES[key];
      const data = await fetchTableData(key);
      const master = isMaster(key);

      // 渲染元信息(主数据表加"新增"按钮)
      const meta = document.getElementById("table-meta");
      const isFact = table.type === "fact";
      meta.className = "table-meta" + (isFact ? " fact" : "");
      meta.innerHTML = `
        <div><strong>表名:</strong> ${key}</div>
        <div><strong>类型:</strong> ${table.typeLabel}</div>
        <div class="desc"><strong>说明:</strong> ${table.description}</div>
        <div class="stats">${data.length} 行数据</div>
        ${master ? `<button class="btn-add" onclick="openModal('create')">➕ 新增</button>` : `<span class="readonly-hint">· 只读</span>`}
      `;

      // 构建 Tabulator 列定义
      const columns = table.columns.map(col => {
        const colDef = {
          title: col.label,
          field: col.field,
          width: col.width || 120,
          headerSort: true,
          headerFilter: true,
        };

        if (col.type === "boolean") {
          colDef.formatter = "tickCross";
          colDef.formatterParams = { allowEmpty: true };
          colDef.align = "center";
        }

        if (col.type === "number") {
          colDef.align = "right";
          colDef.formatter = "number";
          colDef.formatterParams = { precision: 2 };
        }

        // 空值显示(无 formatter 时)
        if (!colDef.formatter) {
          colDef.formatter = function(cell) {
            const v = cell.getValue();
            if (v === null || v === undefined || v === "") return '<span style="color:#c0c4cc;">—</span>';
            return v;
          };
        }

        return colDef;
      });

      // 主数据表末尾加"操作"列(修改/删除)
      if (master) {
        columns.push({
          title: "操作",
          field: "__actions__",
          width: 140,
          headerSort: false,
          headerFilter: false,
          align: "center",
          formatter: function(cell) {
            const pkField = PK_FIELDS[key];
            const pkValue = cell.getRow().getData()[pkField];
            return `
              <button class="btn-action btn-edit" data-pk="${pkValue}">修改</button>
              <button class="btn-action btn-delete" data-pk="${pkValue}">删除</button>
            `;
          },
          cellClick: function(e, cell) {
            const target = e.target;
            if (!target.classList.contains('btn-action')) return;
            const pkValue = target.getAttribute('data-pk');
            if (target.classList.contains('btn-edit')) {
              openModal('edit', pkValue);
            } else if (target.classList.contains('btn-delete')) {
              handleDelete(key, pkValue);
            }
          }
        });
      }

      // 销毁旧实例
      if (tabulatorInstance) {
        tabulatorInstance.destroy();
      }

      // 创建新表格
      tabulatorInstance = new Tabulator("#data-table", {
        data: data,
        columns: columns,
        layout: "fitColumns",
        height: "auto",
        pagination: "local",
        paginationSize: 20,
        paginationSizeSelector: [10, 20, 50, 100],
        movableColumns: true,
        resizableRows: true,
        tooltips: true,
        placeholder: "无数据",
      });
    }

    // ============================================================
    // Modal:新增/修改 弹窗
    // ============================================================
    function openModal(mode, pkValue) {
      currentMode = mode;
      const table = TABLES[currentTable];
      const pkField = PK_FIELDS[currentTable];

      // 修改模式:从当前 Tabulator 数据中找出该行
      let rowData = {};
      if (mode === 'edit') {
        const data = tabulatorInstance.getData();
        rowData = data.find(r => String(r[pkField]) === String(pkValue)) || {};
        if (!rowData[pkField]) {
          alert('未找到该行数据');
          return;
        }
      }
      currentRowData = rowData;

      // 标题
      document.getElementById('modal-title').textContent =
        `${mode === 'create' ? '新增' : '修改'} - ${table.name}`;

      // 渲染表单字段
      const formBody = document.getElementById('modal-form-body');
      formBody.innerHTML = '';

      table.columns.forEach(col => {
        // 跳过虚拟字段(JOIN 结果,如 patient_name 等)
        if (col.virtual) return;

        // 跳过 created_at(后端自动生成,用户不应手动填)
        if (col.field === 'created_at') return;

        const isPK = col.field === pkField;
        // 主键在新增时不显示
        if (isPK && mode === 'create') return;

        const row = document.createElement('div');
        row.className = 'form-row';

        const label = document.createElement('label');
        label.textContent = col.label;
        label.htmlFor = `field-${col.field}`;

        let input;
        if (col.type === 'boolean') {
          // 布尔值:复选框
          input = document.createElement('input');
          input.type = 'checkbox';
          input.id = `field-${col.field}`;
          input.checked = rowData[col.field] === true || rowData[col.field] === 1;
        } else if (col.type === 'number') {
          // 数字:number input
          input = document.createElement('input');
          input.type = 'number';
          input.step = '0.01';
          input.id = `field-${col.field}`;
          input.value = rowData[col.field] ?? '';
        } else if (col.field.endsWith('_date') || col.field.endsWith('_time') || col.field === 'birth_date') {
          // 日期:date input (仅取 YYYY-MM-DD)
          input = document.createElement('input');
          input.type = 'date';
          input.id = `field-${col.field}`;
          const v = rowData[col.field];
          if (v) input.value = String(v).split(' ')[0];
        } else {
          // 文本
          input = document.createElement('input');
          input.type = 'text';
          input.id = `field-${col.field}`;
          input.value = rowData[col.field] ?? '';
        }

        // 主键在修改时只读
        if (isPK) input.readOnly = true;

        const wrap = document.createElement('div');
        wrap.className = 'form-control';
        wrap.appendChild(input);

        row.appendChild(label);
        row.appendChild(wrap);
        formBody.appendChild(row);
      });

      // 显示 modal
      document.getElementById('modal-overlay').classList.add('show');
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('show');
      currentRowData = null;
    }

    // 收集表单数据
    function collectFormData() {
      const table = TABLES[currentTable];
      const pkField = PK_FIELDS[currentTable];
      const payload = {};

      table.columns.forEach(col => {
        if (col.virtual) return;
        const isPK = col.field === pkField;
        if (isPK && currentMode === 'create') return;

        const input = document.getElementById(`field-${col.field}`);
        if (!input) return;

        let value;
        if (col.type === 'boolean') {
          value = input.checked;
        } else if (col.type === 'number') {
          value = input.value === '' ? null : parseFloat(input.value);
        } else {
          value = input.value === '' ? null : input.value;
        }
        payload[col.field] = value;
      });

      return payload;
    }

    // 保存(新增/修改)
    async function handleSave() {
      const payload = collectFormData();
      const pkField = PK_FIELDS[currentTable];
      let url, method;

      if (currentMode === 'create') {
        url = `${API_BASE}/api/${currentTable}`;
        method = 'POST';
      } else {
        const pkValue = currentRowData[pkField];
        url = `${API_BASE}/api/${currentTable}/${pkValue}`;
        method = 'PUT';
      }

      try {
        const res = await fetch(url, {
          method: method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        if (!res.ok) {
          const errText = await res.text();
          throw new Error(`HTTP ${res.status}: ${errText}`);
        }
        closeModal();
        await renderTable(currentTable);  // 刷新表格
      } catch (err) {
        alert('保存失败: ' + err.message + '\n\n请确认后端已启动并连接到 MySQL。');
        console.error('保存失败:', err);
      }
    }

    // 删除
    async function handleDelete(tableKey, pkValue) {
      const pkField = PK_FIELDS[tableKey];
      if (!confirm(`确认删除 ${TABLES[tableKey].name} 中 ${pkField}=${pkValue} 的记录吗?`)) return;

      try {
        const res = await fetch(`${API_BASE}/api/${tableKey}/${pkValue}`, {
          method: 'DELETE',
        });
        if (!res.ok) {
          const errText = await res.text();
          throw new Error(`HTTP ${res.status}: ${errText}`);
        }
        await renderTable(currentTable);
      } catch (err) {
        alert('删除失败: ' + err.message);
        console.error('删除失败:', err);
      }
    }

    // ============================================================
    // 初始化
    // ============================================================
    document.addEventListener("DOMContentLoaded", async function() {
      // 点击遮罩层关闭弹窗
      document.getElementById('modal-overlay').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
      });
      renderTabs();
      await renderTable(currentTable);
    });
  </script>
</body>
</html>
